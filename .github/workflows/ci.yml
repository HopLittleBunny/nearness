name: release-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        with:
          name: nearness-cyclonedx-sbom
          path: nearness.cdx.json
